services:
  manager:
    image: splinterhead27/halyard-manager:latest
    networks:
      - halyard
      - proxy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - halyard_data:/data
    deploy:
      placement:
        constraints:
          - node.role == manager
      labels:
        - traefik.enable=true
        - traefik.http.routers.halyard.rule=Host(`splinter.tools`)
        - traefik.http.services.halyard.loadbalancer.server.port=8080

  agent:
    image: splinterhead27/halyard-agent:latest
    environment:
      AGENT_IMAGE: splinterhead27/halyard-agent:latest
      HOST_PROC: /host/proc
      HOST_SYS: /host/sys
      HOST_ETC: /host/etc
    networks:
      - halyard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc:/host/etc:ro
    deploy:
      mode: global

networks:
  halyard:
    driver: overlay
    external: false
  proxy:
    external: true

volumes:
  halyard_data:
