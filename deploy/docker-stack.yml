services:
  manager:
    image: splinterhead27/halyard-manager:latest
    environment:
      HALYARD_AGENT_TOKEN: ${HALYARD_AGENT_TOKEN:-default-internal-token-change-me}
    networks:
      - halyard
    ports:
      - 8080:8080
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - halyard_data:/data
    deploy:
      placement:
        constraints:
          - node.role == manager
      labels:
        - traefik.enable=true
        - traefik.http.routers.halyard.rule=Host(`halyard.example.com`)
        - traefik.http.services.halyard.loadbalancer.server.port=8080

  agent:
    image: splinterhead27/halyard-agent:latest
    environment:
      HOST_PROC: /host/proc
      HOST_SYS: /host/sys
      HOST_ETC: /host/etc
      HALYARD_AGENT_TOKEN: ${HALYARD_AGENT_TOKEN:-default-internal-token-change-me}
    networks:
      - halyard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc:/host/etc:ro
    deploy:
      mode: global

networks:
  halyard:
    driver: overlay
    external: false

volumes:
  halyard_data:
